{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="mb-3">Вход</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <input type="text" class="form-control" name="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
    <div id="error" class="text-danger mt-3" style="display:none;"></div>
    <div class="mt-3 text-center">
        Нет аккаунта? <a href="/register" class="btn btn-link">Зарегистрироваться</a>
    </div>
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const body = new URLSearchParams(formData);

  const response = await fetch("api/v1/users/token", {
    method: "POST",
    body,
    headers: { "Content-Type": "application/x-www-form-urlencoded" }
  });

  if (!response.ok) {
    document.getElementById("error").textContent = "Неверный логин или пароль";
    document.getElementById("error").style.display = "block";
    return;
  }

  const data = await response.json();
  localStorage.setItem("token", data.access_token);
  window.location.href = "/resumes";
});
</script>
{% endblock %}
